services:
  - type: web
    name: mira-whatsapp-agy
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: WHATSAPP_SESSION_B64
        sync: false
      - key: WHATSAPP_HOME_CHANNEL
        sync: false
